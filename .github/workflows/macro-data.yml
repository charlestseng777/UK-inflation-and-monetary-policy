name: Macro dashboard data

# Runs the live pipeline where the internet is open (GitHub's runners), then
# commits the exported history CSVs and the latest snapshot back to the branch
# so any environment can `python -m macrodash import` real data.
on:
  schedule:
    # 05:30 UK time on weekdays. Cron is UTC and ignores daylight saving, so
    # one slot per season; the gate step lets only the right one through.
    - cron: '30 4 * * 1-5'   # 05:30 BST
    - cron: '30 5 * * 1-5'   # 05:30 GMT
  push:
    branches: ['claude/**']
    paths: ['macro/backend/**', 'macro/config/**', '.github/workflows/macro-data.yml']
  workflow_dispatch:

concurrency:
  group: macro-data-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Gate on 05:30 UK
        id: gate
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          offset=$(TZ=Europe/London date +%z)
          slot="${{ github.event.schedule }}"
          if { [ "$offset" = "+0100" ] && [ "$slot" = "30 4 * * 1-5" ]; } || \
             { [ "$offset" = "+0000" ] && [ "$slot" = "30 5 * * 1-5" ]; }; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: macro/backend/requirements*.txt

      - name: Install
        if: steps.gate.outputs.run == 'true'
        run: pip install -r macro/backend/requirements-dev.txt

      - name: Unit tests
        if: steps.gate.outputs.run == 'true'
        working-directory: macro/backend
        run: python -m pytest -q

      - name: Fetch, compute, export
        if: steps.gate.outputs.run == 'true'
        working-directory: macro/backend
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REFINITIV_APP_KEY: ${{ secrets.REFINITIV_APP_KEY }}
          REFINITIV_USERNAME: ${{ secrets.REFINITIV_USERNAME }}
          REFINITIV_PASSWORD: ${{ secrets.REFINITIV_PASSWORD }}
          REFINITIV_CLIENT_ID: ${{ secrets.REFINITIV_CLIENT_ID }}
          REFINITIV_CLIENT_SECRET: ${{ secrets.REFINITIV_CLIENT_SECRET }}
        run: |
          mkdir -p ../data/export
          python -m macrodash import || true
          python -m macrodash sources > ../data/export/sources-report.txt 2>&1 || true
          tail -n 80 ../data/export/sources-report.txt
          python -m macrodash run
          python -m macrodash export

      - name: Commit data
        if: steps.gate.outputs.run == 'true'
        run: |
          git add macro/data/export
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          AS_OF=$(python -c "import json;print(json.load(open('macro/data/export/dashboard.json'))['meta']['as_of'])")
          git commit -m "macro data: refresh through ${AS_OF}"
          for i in 1 2 3; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break; sleep 5; done
